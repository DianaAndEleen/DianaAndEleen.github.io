<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 / 注册 · 青简</title>
  <meta name="description" content="登录青简作者中心，管理你的作品与草稿。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%23e6b45c'/><path d='M6 6v12h4l2-2 2 2h4V6H14l-2 2-2-2z' fill='%236b4a13'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/account.css">
</head>
<body>
  <div data-layout-topbar></div>

  <main class="container account-page">
    <div class="auth-layout">
      <section class="auth-intro">
        <span class="auth-kicker">青简作者中心</span>
        <h1>把你的故事，<br>写进更多人的夜晚。</h1>
        <p>登录后可以创建作品、保存草稿、编辑章节并发布到书库。当前版本使用浏览器本地存储演示完整流程，适合先验证产品形态。</p>
      </section>

      <section class="auth-card">
        <div class="auth-tabs">
          <button class="auth-tab active" type="button" data-auth-tab="login">登录</button>
          <button class="auth-tab" type="button" data-auth-tab="register">注册</button>
        </div>

        <form class="auth-form active" data-login-form>
          <h2>欢迎回来</h2>
          <p class="muted">继续写下去，读者还在等下一章。</p>
          <label class="field">
            <span>邮箱</span>
            <input class="input" type="email" name="email" autocomplete="email" placeholder="you@example.com" required>
          </label>
          <label class="field">
            <span>密码</span>
            <input class="input" type="password" name="password" autocomplete="current-password" placeholder="至少 6 位" required>
          </label>
          <div class="form-actions">
            <button class="btn btn-primary" type="submit">登录</button>
            <button class="btn btn-ghost" type="button" data-demo-login>使用体验账号</button>
          </div>
          <p class="form-error" data-form-error></p>
          <div class="auth-note">体验账号：<b>demo@qingjian.local</b> / <b>qingjian</b>。账号数据仅保存在当前浏览器。</div>
        </form>

        <form class="auth-form" data-register-form>
          <h2>创建账号</h2>
          <p class="muted">先从一个昵称开始，之后随时可以修改。</p>
          <label class="field">
            <span>昵称</span>
            <input class="input" type="text" name="name" autocomplete="nickname" placeholder="你希望读者怎么称呼你" required>
          </label>
          <label class="field">
            <span>邮箱</span>
            <input class="input" type="email" name="email" autocomplete="email" placeholder="you@example.com" required>
          </label>
          <label class="field">
            <span>密码</span>
            <input class="input" type="password" name="password" autocomplete="new-password" placeholder="至少 6 位" required>
          </label>
          <label class="field">
            <span>确认密码</span>
            <input class="input" type="password" name="confirm" autocomplete="new-password" placeholder="再输入一次" required>
          </label>
          <div class="form-actions">
            <button class="btn btn-primary" type="submit">注册并进入写作台</button>
          </div>
          <p class="form-error" data-form-error></p>
          <div class="auth-note">这是前端原型，不会把你的邮箱或密码发送到服务器。</div>
        </form>
      </section>
    </div>
  </main>

  <div data-layout-footer></div>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
